<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CareerSim AI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="career-body">
	<div class="background-orbs"></div>
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
		<section class="career-card glass-panel">
			<div class="text-center mb-4">
				<img src="{{ url_for('logo') }}" alt="CareerSim AI logo" class="career-logo mb-3">
				<p class="eyebrow mb-2">AI Career Forecast</p>
				<h1 class="display-5 fw-bold mb-2">CareerSim AI</h1>
				<p class="subtitle mb-0">Predict your future career path</p>
			</div>

			<form class="row g-3" action="/predict" method="POST">
				<div class="col-12">
					<label for="skills" class="form-label">Skills</label>
					<input type="text" class="form-control career-input" id="skills" name="skills" placeholder="Python, design, analytics, leadership">
				</div>

				<div class="col-12 col-md-6">
					<label for="experience" class="form-label">Experience</label>
					<input type="number" class="form-control career-input" id="experience" name="experience" min="0" placeholder="Years of experience">
				</div>

				<div class="col-12 col-md-6">
					<label for="target_year" class="form-label">Target Year</label>
					<input type="number" class="form-control career-input" id="target_year" name="target_year" min="2026" placeholder="2030">
				</div>

				<div class="col-12">
					<label for="education" class="form-label">Education</label>
					<select class="form-select career-input" id="education" name="education">
						<option selected disabled>Select your highest level</option>
						<option value="High School">High School</option>
						<option value="Diploma">Diploma</option>
						<option value="Bachelor's">Bachelor's</option>
						<option value="Master's">Master's</option>
						<option value="PhD">PhD</option>
					</select>
				</div>

				<div class="col-12 pt-2">
					<button type="submit" class="btn predict-btn w-100">Predict</button>
				</div>
			</form>
		</section>
	</main>
	<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
